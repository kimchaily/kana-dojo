var EN_DATA={"mh":{"あ":"Inside あ hides a slanted capital *A* with a loop below. *A*h!","い":"Two strokes side by side, like two *ee*ls (i) standing upright.","う":"Someone doubled over after a punch to the belly: «*Oo*f!» (u)","え":"A ninja with a feather on his head looks puzzled: «*Eh*?»","お":"Like あ, but with a dot at the top right: «*Oh*, the golf ball flies away!»","か":"A *ka*rate kick: a figure with a bent leg, a splinter flying beside it.","き":"An old *key* (ki) with two teeth.","く":"The open beak of a *cu*ckoo: «coo-coo» (ku).","け":"A *ke*g standing next to a post.","こ":"Two *ko*i fish swimming one above the other.","さ":"A *sa*murai holding a sword across (き has two crossbars, さ only one).","し":"A fishing hook. *She* (shi) caught a fish with it.","す":"A noodle with a loop that you slurp: «*su*-u».","せ":"A *se*at seen from the side: seat and backrest.","そ":"A zigzag stitch: that’s how you *sew* (so).","た":"On the left a «t», on the right a small «a» (こ): together *ta*.","ち":"Looks like a 5. The *chee*rleader (chi) shouts «Give me five!»","つ":"A big wave: *tsu*nami.","て":"A curved «T» as in *te*lephone.","と":"A *toe* with a thorn stuck in it.","な":"A cross with a knot below, like a *na*pkin tied up.","に":"On the left a leg, on the right the bent *knee* (ni).","ぬ":"Tangled *noo*dles (nu) with a small loop at the end.","ね":"A cat, *ne*ko in Japanese, with a curled tail.","の":"A crossed-out circle like a sign: *No*!","は":"A stroke on the left, a cross with a loop on the right: an «H» and an «a», *ha*.","ひ":"A wide grin: *hee*-hee (hi).","ふ":"Mount *Fu*ji with a snowcap and clouds on its slopes.","へ":"A *he*ap of hay. Or: «*Hey*, it goes uphill.»","ほ":"Like は with a roof: Santa with his hat shouts «*Ho*-ho».","ま":"A ship’s *ma*st with two yards.","み":"Looks like «21». Who is 21? *Me* (mi).","む":"A cow says *moo* (mu): head with a looped nose and a horn.","め":"Like ぬ without the loop: an eye. Eye in Japanese is *me*.","も":"A fishhook with two crossbars: with it you catch *mo*re fish.","や":"A *ya*k with two horns.","ゆ":"A fish swimming a turn: a «*you*-turn».","よ":"A *yo*-yo hanging from its string.","ら":"A *ra*bbit in profile with one ear up.","り":"Two *ree*ds (ri) bending in the wind.","る":"Like ろ, but with a *loo*p (ru) at the end.","れ":"Like ね, but the tail swings outward: someone kneeling in *re*verence.","ろ":"A winding *ro*ad shaped like a 3. No loop.","わ":"Like ね and れ, but with a big round belly: «*Wa*hoo, I ate too much.»","を":"Someone stands at the shore and gasps: «*Wo*w!» Pronounced just «o», used only as a particle.","ん":"Looks like a handwritten small *n*."},"mk":{"ア":"An *a*xe with a handle.","イ":"An *ea*sel (i).","ウ":"Like う, only angular: «*Oo*f» with corners.","エ":"A steel beam in cross-section, the kind used for *e*levators.","オ":"An *o*pera singer spreading the arms: «Ooo!»","カ":"Like か without the splinter: the angular *ka*rate kick.","キ":"Like き without the bottom: the bit of a *key*.","ク":"A *coo*kie broken in half, seen from the side.","ケ":"A slanted «K»: *ke*.","コ":"Two corners: a *co*rner. An angular «C».","サ":"A *sa*ddle with two stirrups.","シ":"*She* smiles: the dashes lie almost flat, the long stroke rises from below.","ス":"A slide: «*su*-u», and you are at the bottom.","セ":"Like せ, only angular: the *se*at.","ソ":"A needle stitch, that’s how you *sew* (so): the dashes stand almost upright, the long stroke falls from above.","タ":"Like ク with a stroke inside: a *ta*co with filling.","チ":"A *chee*rleader (chi) with arms spread.","ツ":"*Tsu*nami from above: two drops fall straight down, the long stroke runs from top to bottom.","テ":"A *te*legraph pole.","ト":"A *to*tem pole with one arm.","ナ":"A plain cross like a knife and fork: knife is *na*ifu in Japanese.","ニ":"Two strokes. Two in Japanese is *ni*.","ヌ":"ス with an extra stroke: *noo*dles stabbed with a chopstick.","ネ":"A *ne*st on top of a tree.","ノ":"A single slash: crossed out, *no*.","ハ":"A *ha*t. Or the open mouth of «*ha*-ha».","ヒ":"An angular grin rops the rest.","た":"No resemblance. Scene: the «t» and «a» (た) are wrapped in a taco (タ).","ち":"Both: a crossbar on top, then a stroke down. ち curls into a 5, チ stays straight.","つ":"The curve of つ is in ツ. The wave splashes, so two drops come first.","て":"Both start with a crossbar and end in a curve. テ has one more stroke.","と":"Both: a stem with a short stroke. In と the stem is curved, in ト it stands straight.","な":"ナ is the cross at the top left of な. Loop and dot are gone.","に":"ニ is the two strokes on the right of に, without the post on the left.","ぬ":"Of the tangled noodles (ぬ), ヌ keeps only the frame: a curve and a crossing stroke.","ね":"No resemblance. Scene: the cat (ね) looks up at the nest (ネ).","の":"ノ is the first stroke of の: the slash, without the circle.","は":"No resemblance. Both laugh «ha-ha»: は with an H and an a, ハ as an open mouth.","ひ":"Both are an open bowl: ひ opens upward, ヒ to the right.","ふ":"フ is the outline of ふ: the slope of Fuji without clouds.","へ":"Practically the same. The same heap of hay in both scripts.","ほ":"ホ is the cross from the right half of ほ, with two rays instead of the loop.","ま":"No resemblance. Scene: Mama (マ) calls down from the mast (ま).","み":"No resemblance. ミ is three strokes, and «mittsu» means three. Remember み as 21.","む":"Both end with an angle and a short stroke. ム is む without the loop.","め":"メ is the cross in the middle of め, without the curve around it.","も":"Almost the same: モ is も with straight strokes, without the hook at the bottom.","や":"Almost the same: ヤ is や without the small drop.","ゆ":"Hardly alike. Both make a turn («you-turn»): ゆ round, ユ angular.","よ":"In よ one stroke points right, in ヨ three point left: the yo-yo (よ) sits on the shelf (ヨ).","ら":"Both: a short stroke on top, a curve to the left below. ラ is the angular version.","り":"Almost the same: two strokes, the right one longer. リ is just straighter.","る":"Hardly alike. る curls up, ル spreads two roots.","れ":"レ is the last stroke of れ: down t the angle. ワ adds a stroke on the left. ウ is ワ with a dab on top.","フラヲ":"ラ is フ with a stroke above it. ヲ is フ with a stroke in the middle.","コユヨロ":"コ is open on the left. In ユ the bottom stroke sticks out on the right. ヨ has three crossbars. ロ is closed all round.","スヌ":"ヌ is ス with a stroke crossing the curve.","チテ":"In テ the curve hangs below the two crossbars. In チ the stroke goes through the lower crossbar.","ナメ":"ナ is an upright cross, メ a slanted one.","マムア":"マ has its point at the bottom. ム has its point at the top and a short stroke at the end. ア is マ with a stroke going down to the left.","セヤ":"セ ends at the bottom with a corner to the right. In ヤ the long stroke goes diagonally down through it."},"cult":{"c1":["Custom","Staff don’t come by themselves","In many restaurants the staff wait until you call. «Sumimasen!» is normal for that and not rude. Often there is also a call button on the table.","excuse me"],"c4":["Fact","You can’t see dashi","Fish stock is in miso soup, udon and soba broth, many sauces and egg dishes. «Vegetarian» is often understood as «no visible meat». That makes the dashi sentence the most important one in the pack.","stock"],"c13":["Osaka","Osaka speaks Kansai-ben","You will hear «ōkini» for thanks, «maido» as a greeting in shops and «honma?» for «really?». Everyone understands standard Japanese. You don’t need to speak the dialect, only recognise it.","really"],"c6":["Custom","Money goes on the tray","At the till there is a small tray. Put cash or your card there instead of into the cashier’s hand. Change often comes back the same way.","change"],"c5":["Rule","Walnut is on the label","Packaged food must list walnut as an allergen. Look for くるみ in the ingredients. In restaurants and with unpackaged food you can’t rely on this; there, only asking helps.","walnut"],"c8":["Osaka","ICOCA: the card that means «Shall we go?»","JR West’s transit card is called ICOCA. The name plays on «iko ka», Kansai dialect for «Shall we go?». It works on trains, buses and in many shops.","ICOCA card"],"c2":["Custom","No tipping, you pay at the till","Tipping is not customary and is often handed back. Usually you take the slip from the table and pay at the till by the exit.","bill"],"c14":["Custom","«Hai» doesn’t always mean yes","«Hai» often just shows that someone is listening. You rarely hear a clear no. «Chotto …» with a hesitation usually means something won’t work.","a little / rather not"],"c3":["Custom","Otōshi: the starter nobody ordered","In izakaya a small dish often arrives unasked and is charged as a cover. In Kansai it is also called tsukidashi. It often contains fish or meat, so ask.","cover-charge starter"],"c9":["Osaka","Escalators: stand on the right in Osaka","In Osaka people stand on the right out of habit, in Tokyo on the left. Operators now ask everyone to stand on both sides. Watch what the people in front of you do.","escalator"],"c15":["Custom","Four and nine have two names","«Shi» (4) sounds like «death», «ku» (9) like «suffering». That’s why people mostly say «yon» and «kyū». You may know four as an unlucky number from Chinese.","four"],"c16":["Expectation","Never stick chopsticks into rice","Chopsticks standing upright recall a funeral rite, as does passing food from chopsticks to chopsticks. Put them on the rest or across the bowl.","chopsticks"],"c7":["Rule","Bags cost money","Plastic bags have cost money since 2020. At the till you will be asked whether you need one: «Fukuro wa irimasu ka?»","bag"],"c11":["Expectation","Bow instead of shaking hands","A slight bow is enough as a greeting. People usually only shake hands if the other person offers. «Yoroshiku onegaishimasu» closes every introduction.","please treat me well"],"c10":["Expectation","Trains are quiet","Phone calls on the train are considered disturbing. Phones are on «manner mode», that is, silent. This is taken especially seriously near the priority seats.","silent mode"],"c17":["Custom","A curtain means: open","If the   S.crs.unshift({id:uid(),t:ui.cr.type,title:t.slice(0,120),body:b.slice(0,4000),at:Date.now(),where:crWhere(),sent:false});save();ui.cr.title='';ui.cr.body='';render();toast('Notiert. Jetzt oder später in den Backlog schicken.')},
 crsend:function(d){setTimeout(function(){S.crs.forEach(function(c){if(c.id===d.i)c.sent=true});save();render()},400)},
 crunsend:function(d){S.crs.forEach(function(c){if(c.id===d.i)c.sent=false});save();render()},
 crdel:function(d){if(ui.confirm!==d.i){ui.confirm=d.i;render();return}S.crs=S.crs.filter(function(c){return c.id!==d.i});S.del['c:'+d.i]=Date.now();ui.confirm=null;save();render()},
 crclear:function(){S.crs.forEach(function(c){if(c.sent)S.del['c:'+c.id]=Date.now()});S.crs=S.crs.filter(function(c){return!c.sent});save();render()},
 crcopy:function(){copy(crText(S.crs.filter(function(c){return!c.sent})),'Kopiert. Im Claude-Chat einfügen.')},
 ttsdata:function(){try{X.android.installTtsData()}catch(e){}}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var f=ACT[t.dataset.a];if(f){if(t.tagName!=='SUMMARY'&&t.tagName!=='A')e.preventDefault();f(t.dataset,t)}});

 _test:{kanaDue:kanaDue,EN_DATA:EN_DATA,DE:DE,buildEN:buildEN,MH:MH,MK:MK,mergeState:mergeState,SIM:SIM,DLG:DLG,SENT:SENT,itemById:itemById,state:function(){return S},BR:BR,CULT:CULT,ORIH:ORIH,ORIK:ORIK,B:BUILTIN,toHira:toHira,laut:laut,romajiOf:romajiOf}
};
