/* Layout: Übungsheft. Kana stehen in Genkō-Yōshi-Kästchen mit Hilfslinien; gelernte Reihen tragen einen Hanko-Stempel.
   Zugeklappt: eine Spalte, Tab-Leiste unten. Aufgeklappt/Tablet: Schiene links, zwei Spalten (Liste + Detail). */
:root{
  --hue:265; --cs:1;
  --bg:oklch(97.2% calc(.008*var(--cs)) var(--hue));
  --surface:oklch(99.4% calc(.004*var(--cs)) var(--hue));
  --sunk:oklch(94.6% calc(.012*var(--cs)) var(--hue));
  --ink:oklch(25% calc(.035*var(--cs)) var(--hue));
  --muted:oklch(49% calc(.03*var(--cs)) var(--hue));
  --line:oklch(88% calc(.016*var(--cs)) var(--hue));
  --accent:oklch(44% calc(.14*var(--cs)) var(--hue));
  --accent-soft:oklch(92.5% calc(.04*var(--cs)) var(--hue));
  --on-accent:oklch(98.5% .005 var(--hue));
  --shu:oklch(57% .19 32);
  --good:oklch(52% .13 155);
  --shadow:0 10px 30px -12px oklch(25% .05 var(--hue) / .35);
  --jp:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:oklch(18.5% calc(.02*var(--cs)) var(--hue)); --surface:oklch(23.5% calc(.025*var(--cs)) var(--hue));
    --sunk:oklch(15.5% calc(.02*var(--cs)) var(--hue)); --ink:oklch(94% calc(.012*var(--cs)) var(--hue));
    --muted:oklch(71% calc(.025*var(--cs)) var(--hue)); --line:oklch(34% calc(.03*var(--cs)) var(--hue));
    --accent:oklch(78% calc(.11*var(--cs)) var(--hue)); --accent-soft:oklch(31% calc(.06*var(--cs)) var(--hue));
    --on-accent:oklch(18% .02 var(--hue)); --shu:oklch(68% .17 32); --good:oklch(74% .14 155);
    --shadow:0 10px 30px -12px oklch(0% 0 0 / .7); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:oklch(18.5% calc(.02*var(--cs)) var(--hue)); --surface:oklch(23.5% calc(.025*var(--cs)) var(--hue));

  --accent:oklch(78% calc(.11*var(--cs)) var(--hue)); --accent-soft:oklch(31% calc(.06*var(--cs)) var(--hue));
  --on-accent:oklch(18% .02 var(--hue)); --shu:oklch(68% .17 32); --good:oklch(74% .14 155);
  --shadow:0 10px 30px -12px oklch(0% 0 0 / .7); color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
:root[data-skin="matcha"]{--hue:148}
:root[data-skin="sakura"]{--hue:355}
:root[data-skin="kaki"]{--hue:62}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1{font:800 26px/1.15 var(--ui);letter-spacing:-.02em;text-wrap:balance}
h2{font:800 18px/1.25 var(--ui);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 15px/1.3 var(--ui)}
.jp{font-family:var(--jp);font-weight:600}
.eyebrow{font:700 11px/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
header.row>h1{min-width:max-content}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:6px 4px;border-radius:12px;color:var(--muted);font:700 11px/1.2 var(--ui)}
.nav button i{font:600 21px/1.15 var(--jp);font-style:normal}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
body.staged .nav{display:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.ico{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;flex:none;font-size:17px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px oklch(0% 0 0 / .15)}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:110px;resize:vertical;font:500 13px/1.45 ui-monospace,Menlo,monospace}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px;min-width:0}

/* Genkō-Yōshi-Kästchen */
.sq{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center;
  font:600 clamp(20px,6.2vw,30px)/1 var(--jp);padding:0;color:var(--ink);min-width:0}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none;border:0 dashed var(--line)}
.sq::before{left:50%;top:8%;bottom:8%;border-left-width:1px}
.sq::after{top:50%;left:8%;right:8%;border-top-width:1px}
.sq>span{position:relative;z-index:1}
.sq small{position:absolute;right:4px;bottom:3px;z-index:1;font:700 9.5px/1 var(--ui);color:var(--muted)}
.sq.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sq.ok small{color:var(--good)}
.sq.blank{visibility:hidden}
.sq.big{width:min(200px,52vw);font-size:min(120px,31vw);border-radius:10px;border-width:1.5px}
.gojuon{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.krow:first-child{border-top:0;padding-top:0}
.hanko{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--shu);color:var(--shu);border-radius:6px;font:600 14px/1 var(--jp);transform:rotate(-6deg);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:700 12px/1.4 var(--ui);background:var(--accent-soft);color:var(--accent)}
.pill.shu{background:none;border:1.5px solid var(--shu);color:var(--shu)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>b{display:block;height:100%;background:var(--accent);border-radius:99px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mnemo{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.mnemo b{color:var(--accent)}
.romaji{font:800 30px/1.1 var(--ui);letter-spacing:-.01em}
.laut{font:600 13px/1.3 var(--ui);color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.path li:first-child{border-top:0}
.path .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--ui);background:var(--sunk);color:var(--muted)}
.path li.done .n{background:var(--accent);color:var(--on-accent)}
.path li.now .n{box-shadow:0 0 0 2px var(--accent);color:var(--accent);background:var(--accent-soft)}

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.pack{text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pack .em{font-size:24px;grid-row:span 2}
.pack.act{border-color:var(--accent)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .r{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.item .k{font:600 15px/1.4 var(--jp);overflow-wrap:anywhere}

.stage{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:260px;justify-content:center}
.flash .q{font:800 clamp(20px,5.6vw,28px)/1.25 var(--ui);text-wrap:balance;overflow-wrap:anywhere}
.flash .kana{font:600 clamp(20px,5.6vw,28px)/1.4 var(--jp);overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);min-height:68px;font:800 20px/1.1 var(--ui);padding:8px}
.opt.k{font:600 34px/1 var(--jp)}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--shu);color:var(--shu)}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grades .btn{flex-direction:column;gap:0;border-radius:var(--r);padding:8px 4px}
.grades small{font-weight:600;color:var(--muted);font-size:11px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
.tbl td b{font:600 19px/1.2 var(--jp);display:block}
details.card>summary{cursor:pointer;font-weight:800;font-size:16px}
details.card[open]>summary{margin-bottom:12px}
.guide{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.guide div{border-left:3px solid var(--accent-soft);padding-left:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}

@media (max-width:719px){
  .detail.sheet{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:var(--shadow);max-height:62vh;overflow:auto}
  .detail.sheet.none{display:none}
}
@media (min-width:720px){
  .nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);
    padding:calc(18px + env(safe-area-inset-top,0px)) 8px 18px max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex:none;padding:10px 4px}
  body.staged .nav{display:flex}
  .wrap{padding-left:calc(92px + max(24px,env(safe-area-inset-left,0px)));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 40px}
  .cols.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols.half{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
  .detail.sheet{position:sticky;top:20px}
  .detail .x{display:none}
  .sq{font-size:30px}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:no-preference){.flash,.detail{transition:border-color .15s}}
</style>

 '<p class="muted small">Sprich den Laut dreimal laut und fahre das Zeichen mit dem Finger auf dem Tisch nach.</p>'+

 var o=cands.concat(rest).slice(0,3).concat([c]).sort(function(){return Math.random()-.5});

 else if(showK==='always'&&dir==='ja')front+='<div class="kana">'+esc(it.k)+'</div>';
 return'<div class="stage">'+head+'<div class="flash">'+(isNew?'<span class="pill">Neu</span>':'')+front+back+'</div>'+
 (st.shown?'<div class="grades"><button class="btn" data-a="grade" data-g="0">Nochmal<small>gleich wieder</small></button><button class="btn pri" data-a="grade" data-g="1">Gewusst<small style="color:inherit;opacity:.8">'+nextIn(it,1)+'</small></button><button class="btn" data-a="grade" data-g="2">Leicht<small>'+nextIn(it,2)+'</small></button></div>':
  '<button class="btn pri wide" data-a="show">Lösung zeigen</button>')+'</div>'}
function nextIn(it,g){var b=Math.min(5,((S.cards[it.id]||{b:0}).b)+g),d=INT[b];return d===1?'morgen':'in '+d+' Tagen'}

/* ---------- Render ---------- */
var TABS=[['home','今','Heute'],['kana','あ','Kana'],['words','語','Wörter'],['more','設','Mehr']];
function render(){
 document.body.classList.toggle('staged',!!ui.stage);
 $('nav').innerHTML=TABS.map(function(t){return'<button data-a="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]&&!ui.stage?' aria-current="page"':'')+'><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('');
 $('main').innerHTML=ui.stage?vStage():ui.tab==='kana'?vKana():ui.tab==='words'?vWords():ui.tab==='more'?vMore():vHome()}
function go(){render();window.scrollTo(0,0)}

/* ---------- Aktionen ---------- */
function startLesson(script,rowId){var row=rowId?ROWS.filter(function(r){return r[0]===rowId})[0]:null;
 if(!row){for(var i=0;i<ROWS.length;i++)if(S.learned[script].indexOf(ROWS[i][0])<0){row=ROWS[i];break}}
 if(!row)row=ROWS[0];ui.script=script;ui.stage={t:'lesson',script:script,row:row,i:0};go()}
function startQuiz(pool,focus,total){if(!pool.length)return;var st={t:'quiz',pool:pool,focus:focus||[],n:0,total:total||10,ok:0,miss:[],q:null};st.q=makeQ(st);ui.stage=st;go()}
function startReview(){var q=dueItems().map(function(i){return i.id}).concat(newItems().slice(0,8).map(function(i){return i.id}));if(!q.length)return;
 ui.stage={t:'review',q:q,done:0,shown:false,peek:false};go();if(S.set.dir==='ja'&&S.set.auto){var it=itemById(q[0]);if(it)speak(it.k)}}
function promptFor(topic){return'Du bist Japanischlehrer für einen deutschsprachigen Anfänger, der in Osaka leben wird. Situation: «'+topic+'».\n'+
 'Nenne die 12 wichtigsten Wörter und Sätze dafür: höflich (desu/masu-Form), kurz, alltagstauglich. Zuerst, was man selbst sagt, am Schluss 2 bis 3 Dinge, die man typischerweise hört.\n'+
 'Antworte nur mit JSON in dieser Form, ohne weiteren Text:\n{"title": "kurzer deutscher Titel", "emoji": "ein Emoji", "items": [{"r": "Hepburn-Rōmaji mit Makron (ā ī ū ē ō)", "k": "nur Hiragana und Katakana, keine Kanji", "d": "deutsche Bedeutung", "n": "kurzer Hinweis oder leer"}]}'}
function addPack(data,topic){
 if(!data||!Array.isArray(data.items))throw new Error('Kein gültiges Paket: «items» fehlt.');
 var items=data.items.filter(function(x){return x&&typeof x.r==='string'&&typeof x.d==='string'&&x.r.trim()&&x.d.trim()}).slice(0,60).map(function(x){
  return{id:uid(),r:x.r.trim().slice(0,200),k:(typeof x.k==='string'&&x.k.trim()?x.k.trim():toHira(x.r)).slice(0,200),d:x.d.trim().slice(0,200),n:typeof x.n==='string'?x.n.trim().slice(0,200):''}});
 if(!items.length)throw new Error('Das Paket enthält keine verwertbaren Einträge.');
 var p={id:'c'+uid(),em:typeof data.emoji==='string'?data.emoji.slice(0,4):'🗂️',title:String(data.title||topic||'Neues Paket').slice(0,60),sub:topic?String(topic).slice(0,80):'',items:items};
 S.packs.push(p);S.active.push(p.id);save();ui.open=p.id;ui.gen=null;return p}
function parseLoose(t){t=String(t||'');var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('Kein JSON gefunden.');return JSON.parse(t.slice(a,b+1))}
function copy(text,ok){var done=function(){toast(ok||'Kopiert')};
 try{if(X.android&&X.android.copy){X.android.copy(text);return done()}}catch(e){}
 var fb=function(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Kopieren nicht möglich')}ta.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fb);else fb()}
function appVersion(){try{return X.android.version()}catch(e){return''}}

var ACT={
 tab:function(d){ui.tab=d.t;ui.stage=null;ui.open=null;ui.sel=null;go()},
 script:function(d){ui.script=d.s;ui.sel=null;render()},
 sel:function(d){ui.sel=d.c;render();if(S.set.auto)speak(toHiraCh(d.c))},
 unsel:function(){ui.sel=null;render()},
 say:function(d){speak(d.t)},
 rules:function(){ui.tab='kana';ui.rulesOpen=true;render();var r=$('rules');if(r)r.scrollIntoView()},
 lesson:function(d){startLesson(d.s||ui.script,d.r)},
 lprev:function(){ui.stage.i--;render()},
 lnext:function(){var st=ui.stage,chars=rowChars(st.row,st.script);
  if(st.i<chars.length-1){st.i++;render();if(S.set.auto)speak(toHiraCh(chars[st.i]));return}
  var L=S.learned[st.script];if(L.indexOf(st.row[0])<0)L.push(st.row[0]);touchDay();save();
  var pool=[];ROWS.forEach(function(r){if(L.indexOf(r[0])>=0)pool=pool.concat(rowChars(r,st.script))});startQuiz(pool,chars,8)},
 quiz:function(d){var sc=ui.tab==='kana'?ui.script:(S.learned.k.length&&S.learned.h.length>=10?'k':'h'),pool=[];
  if(d.all)pool=allChars(sc);else ROWS.forEach(function(r){if(S.learned[sc].indexOf(r[0])>=0)pool=pool.concat(rowChars(r,sc))});
  if(!pool.length)pool=allChars(sc);startQuiz(pool,[],10)},
 quizagain:function(){var st=ui.stage;startQuiz(st.pool,st.miss,st.total)},
 ans:function(d){var st=ui.stage,q=st.q;if(q.a!=null)return;q.a=d.c;var ok=d.c===q.c,k=S.kana[q.c]||(S.kana[q.c]={s:0,n:0});k.n++;k.s=ok?k.s+1:0;
  if(ok)st.ok++;else if(st.miss.indexOf(q.c)<0)st.miss.push(q.c);touchDay();save();render();if(S.set.auto)speak(toHiraCh(q.c))},
 qnext:function(){var st=ui.stage;st.n++;if(st.n<st.total)st.q=makeQ(st);go()},
 review:function(){startReview()},
 show:function(){var st=ui.stage;st.shown=true;render();var it=itemById(st.q[0]);if(it&&S.set.auto&&S.set.dir!=='ja')speak(it.k)},
 peek:function(){ui.stage.peek=true;render()},
 grade:function(d){var st=ui.stage,id=st.q.shift(),g=+d.g,c=S.cards[id]||{b:0,d:0};
  if(g===0){c.b=0;c.d=Date.now();st.q.splice(Math.min(st.q.length,3),0,id)}else{c.b=Math.min(5,c.b+g);c.d=Date.now()+INT[c.b]*DAY-4*36e5;st.done++}
  S.cards[id]=c;touchDay();save();st.shown=false;st.peek=false;go();
  if(st.q.length&&S.set.dir==='ja'&&S.set.auto){var it=itemById(st.q[0]);if(it)speak(it.k)}},
 closestage:function(){ui.stage=null;go()},
 open:function(d){ui.open=d.p;ui.confirm=null;go()},
 closepack:function(){ui.open=null;go()},
 toggle:function(d){var i=S.active.indexOf(d.p);if(i>=0)S.active.splice(i,1);else S.active.push(d.p);save();render()},
 delpack:function(d){if(ui.confirm!==d.p){ui.confirm=d.p;render();return}var p=packById(d.p);if(p)p.items.forEach(function(i){delete S.cards[i.id]});
  S.packs=S.packs.filter(function(p){return p.id!==d.p});S.active=S.active.filter(function(x){return x!==d.p});ui.open=null;ui.confirm=null;save();go()},
 delitem:function(d){S.packs.forEach(function(p){p.items=p.items.filter(function(i){return i.id!==d.i})});delete S.cards[d.i];save();render()},
 addword:function(){var de=$('w-d').value.trim(),r=$('w-r').value.trim(),k=$('w-k').value.trim();if(!de||!r){toast('Deutsch und Rōmaji ausfüllen');return}
  var p=packById('mine');if(!p){p={id:'mine',em:'✍️',title:'Meine Wörter',sub:'Selbst gesammelt',items:[]};S.packs.push(p);S.active.push('mine')}
  p.items.push({id:uid(),r:r,k:k||toHira(r),d:de,n:''});save();render();toast('Gespeichert in «Meine Wörter»')},
 gen:function(){var topic=$('topic').value.trim();if(!topic){toast('Zuerst die Situation beschreiben');return}if(!X.sample)return;
  ui.gen={busy:true,topic:topic};render();
  X.sample.json(promptFor(topic)).then(function(data){addPack(data,topic);go();toast('Paket erstellt und aktiviert')},function(e){
   var c=e&&e.code;ui.gen={topic:topic,err:c==='not_granted'?'Ohne Freigabe geht es über «Auftrag kopieren» und den Claude-Chat.':c==='rate_limited'?'Gerade zu viele Anfragen. Bitte in einer Minute nochmals.':c==='invalid_json'?'Die Antwort war kein sauberes Paket. Bitte nochmals versuchen.':'Das hat nicht geklappt. Bitte nochmals versuchen.'};
   if(c==='not_granted')X.sample=null;render()}).catch(function(e){ui.gen={topic:topic,err:e.message};render()})},
 copyprompt:function(){var topic=$('topic').value.trim();if(!topic){toast('Zuerst die Situation beschreiben');return}copy(promptFor(topic),'Auftrag kopiert. Im Claude-Chat einfügen.')},
 'import':function(){try{addPack(parseLoose($('imp').value),'');go();toast('Paket übernommen und aktiviert')}catch(e){ui.gen={topic:$('topic').value,err:e.message};render()}},
 set:function(d){var v=d.v;if(d.k==='rate')v=+v;if(d.k==='auto')v=v==='1';S.set[d.k]=v;save();
  if(d.k==='dir'&&ui.stage){ui.stage.shown=false;ui.stage.peek=false}applyTheme();render()},
 'export':function(){ui.io={show:true,mode:'out',text:JSON.stringify(S)};render()},
 copybk:function(){copy(JSON.stringify(S),'Sicherung kopiert')},
 restore:function(){ui.io={show:true,mode:'in',text:''};render()},
 dorestore:function(){try{var s=JSON.parse($('bk').value);if(!s||s.v!==1||!s.cards)throw 0;localStorage.setItem(KEY,JSON.stringify(s));S=load();ui.io=null;applyTheme();go();toast('Sicherung eingespielt')}catch(e){toast('Das ist keine gültige Sicherung')}},
 check:function(){ui.upd=Object.assign(ui.upd||{},{checking:true,msg:''});render();try{X.android.checkUpdate()}catch(e){ui.upd.checking=false;render()}},
 install:function(){ui.upd.busy=true;ui.upd.pct=0;ui.upd.msg='';render();try{X.android.installUpdate(ui.upd.url)}catch(e){ui.upd.busy=false;render()}},
 ttsdata:function(){try{X.android.installTtsData()}catch(e){}}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var f=ACT[t.dataset.a];if(f){if(t.tagName!=='SUMMARY')e.preventDefault();f(t.dataset,t)}});
document.addEventListener('input',function(e){if(e.target.id==='w-r'){var k=$('w-k');if(k&&!k.dataset.touched)k.value=toHira(e.target.value)}if(e.target.id==='w-k')e.target.dataset.touched=e.target.value?'1':''});
document.addEventListener('toggle',function(e){if(e.target.id==='rules')ui.rulesOpen=e.target.open},true);

/* ---------- Brücke zur Android-Hülle ---------- */
window.__kd={
 back:function(){if(ui.stage){ui.stage=null;go();return true}if(ui.open){ui.open=null;go();return true}if(ui.sel&&!window.matchMedia('(min-width:720px)').matches){ui.sel=null;render();return true}if(ui.tab!=='home'){ui.tab='home';go();return true}return false},
 onTts:function(state){X.andTts=state;render()},
 onUpdate:function(info){ui.upd=Object.assign({},info,{checking:false,busy:false});
  if(info.error)ui.upd.msg='Suche fehlgeschlagen: '+info.error;else if(!info.available)ui.upd.msg='Du hast die neuste Version.';render()},
 onProgress:function(p){if(ui.upd){ui.upd.pct=p;if(ui.tab==='more'&&!ui.stage)render()}},
 onInstall:function(msg){if(ui.upd){ui.upd.busy=false;ui.upd.msg=msg}render()},
 _test:{toHira:toHira,laut:laut,romajiOf:romajiOf}
};

/* ---------- Start ---------- */
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Manrope:wght@500;600;700;800&display=swap';document.head.appendChild(l)})();
applyTheme();render();initAudio();
try{window.matchMedia('(min-width:720px)').addEventListener('change',function(){if(ui.tab==='kana'&&!ui.stage)render()})}catch(e){}
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}
if(X.android&&Date.now()-(S.upd||0)>20*36e5){S.upd=Date.now();save();try{X.android.checkUpdate()}catch(e){}}
})();
</script>
