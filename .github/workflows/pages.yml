name: Web-App

# Jeder Push auf main veröffentlicht die Web-App auf GitHub Pages.
# Installierte Web-Apps holen die neue Version beim nächsten Öffnen mit Netz.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Web-App bauen
        run: bash tools/build-pages.sh "${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
