name: Release

# Jeder Push auf main baut eine signierte APK und veröffentlicht sie als GitHub-Release.
# Die App vergleicht ihre Build-Nummer mit dem neusten Release und aktualisiert sich selbst.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Die Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Web-App einbetten
        run: bash tools/build-web.sh

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "kana-dojo-$VERSION.apk"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "kana-dojo-$VERSION.apk" \
            --title "Kana Dōjō $VERSION" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "$GITHUB_SHA"
